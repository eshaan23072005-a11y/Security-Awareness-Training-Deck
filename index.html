n:["ಫಿಶಿಂಗ್ ದಾಳಿಗಳು","ಹ್ಯಾಕಿಂಗ್ ಅಥವಾ ಅನಧಿಕೃತ ಖಾತೆ ಪ್ರವೇಶ","ರ್ಯಾನ್ಸಮ್‌ವೇರ್ ದಾಳಿಗಳು","ಗುರುತಿನ ಕಳವು","ಆನ್‌ಲೈನ್ ಹಣಕಾಸು ವಂಚನೆ","ಸೈಬರ್ ಬುಲ್ಲಿಂಗ್","ಸೈಬರ್ ಸ್ಟಾಕಿಂಗ್","ಪಾಸ್‌ವರ್ಡ್ ದಾಳಿಗಳು","ಮಾಲ್‌ವೇರ್ ದಾಳಿಗಳು","DDoS ದಾಳಿಗಳು","ವೆಬ್‌ಸೈಟ್ ಮೇಲೆ SQL ಇಂಜೆಕ್ಷನ್ ದಾಳಿಗಳು","ವೆಬ್‌ಸೈಟ್ ಡಿಫೇಸ್‌ಮೆಂಟ್","ಸಿಮ್-ಸ್ವಾಪ್ ವಂಚನೆ","ಕ್ರೆಡಿಟ್/ಡೆಬಿಟ್ ಕಾರ್ಡ್ ವಂಚನೆ","ಇಮೇಲ್ ಸ್ಪೂಫಿಂಗ್","ಸೋಶಿಯಲ್ ಇಂಜಿನಿಯರಿಂಗ್ ವಂಚನೆಗಳು","ಕ್ರಿಪ್ಟೋಕರೆನ್ಸಿ ವಂಚನೆ","ಡೇಟಾ ಸೋರಿಕೆ","ಆನ್‌ಲೈನ್ ಉದ್ಯೋಗ ವಂಚನೆಗಳು","ಸೆಕ್ಸ್‌ಟಾರ್ಷನ್ ಮತ್ತು ಆನ್‌ಲೈನ್ ಬ್ಲ್ಯಾಕ್‌ಮೇಲ್"],
a:["ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ವರದಿ ಮಾಡಿ.","ಹಣ ಕಳವಾಗಿದ್ದರೆ 1930ಗೆ ಕರೆ ಮಾಡಿ; ಇಲ್ಲದಿದ್ದರೆ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ವರದಿ ಮಾಡಿ.","ತಕ್ಷಣ 1930ಗೆ ಕರೆ ಮಾಡಿ ಮತ್ತು ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಅಥವಾ ಪಾವತಿ ಸಂಸ್ಥೆಯನ್ನು ಸಂಪರ್ಕಿಸಿ.","ಹಣ ಕಳೆದುಹೋಗಿದ್ದರೆ ಅಥವಾ ವರ್ಗಾವಣೆಯಾಗಿದ್ದರೆ 1930ಗೆ ಕರೆ ಮಾಡಿ, ಆನ್‌ಲೈನ್‌ನಲ್ಲೂ ವರದಿ ಮಾಡಿ.","ಹಣ ಕಳವಾಗಿದ್ದರೆ 1930ಗೆ ಕರೆ ಮಾಡಿ ಮತ್ತು ತಕ್ಷಣ ನಿಮ್ಮ ಮೊಬೈಲ್ ಆಪರೇಟರ್ ಅನ್ನು ಸಂಪರ್ಕಿಸಿ.","ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ವರದಿ ಮಾಡಿ. ತುರ್ತು ಅಥವಾ ತಕ್ಷಣದ ಬೆದರಿಕೆ ಇದ್ದರೆ 112ಗೆ ಕರೆ ಮಾಡಿ.","ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಅಥವಾ ಸ್ಥಳೀಯ ಪೊಲೀಸರಿಗೆ ವರದಿ ಮಾಡಿ.","ಅನಧಿಕೃತ ಪ್ರವೇಶ ಅಥವಾ ಅದರಿಂದ ಆದ ವಂಚನೆಯನ್ನು ವರದಿ ಮಾಡಿ.","ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಅಥವಾ ಪೊಲೀಸರಿಗೆ ವರದಿ ಮಾಡಿ. ತಾಂತ್ರಿಕ ಘಟನೆಗಳಲ್ಲಿ CERT-In ಸಹಾಯ ಮಾಡಬಹುದು.","ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ವರದಿ ಮಾಡಿ. ಸೈಟ್ ಮಾಲೀಕರು ತಮ್ಮ ಹೋಸ್ಟಿಂಗ್ ಪೂರೈಕೆದಾರರಿಗೂ ತಿಳಿಸಬೇಕು."]}

function render(){
 var t=L[lang],out="",n=0;
 D.forEach(function(d,i){

 });
